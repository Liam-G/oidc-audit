[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oidc-audit"
version = "0.2.0"
description = "Offline-first OAuth 2.0 and OpenID Connect configuration auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Liam Giannini, Webcracy.ch" }]
maintainers = [{ name = "Liam Giannini, Webcracy.ch" }]
keywords = ["oauth", "oidc", "security", "audit", "keycloak"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
oidc-audit = "oidc_audit.cli:main"

[project.urls]
Homepage = "https://webcracy.ch"
Repository = "https://github.com/Liam-G/oidc-audit"
Issues = "https://github.com/Liam-G/oidc-audit/issues"
"Security policy" = "https://github.com/Liam-G/oidc-audit/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/oidc_audit"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=oidc_audit --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["oidc_audit"]

